<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LainDOS — source, annotated</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f7f1e6; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d8c9ad; border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  body { scrollbar-color: #d8c9ad transparent; }

  /* faint CRT scanlines over the emulator monitor only */
  .run-scan {
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px);
    opacity: .5;
  }

  /* dither-ish hero background — substitutes for assets/bg_vapor.png */
  .hero-bg {
    background:
      radial-gradient(1200px 600px at 18% 18%, rgba(255, 225, 192, 0.35), transparent 60%),
      radial-gradient(900px 600px at 88% 80%, rgba(126, 224, 212, 0.25), transparent 65%),
      linear-gradient(135deg, #2a1d3a 0%, #3a2230 45%, #5a334b 100%);
  }

  /* v86 screen */
  .v86-screen { color: #e9e7da; overflow: hidden; }
  .v86-screen > div { white-space: pre; font: 15px/1.04 'IBM Plex Mono', monospace; }
  .v86-screen > div, .v86-screen canvas { flex: 0 0 auto; transform-origin: center center; }
  .v86-screen canvas { image-rendering: pixelated; max-width: 100%; max-height: 100%; }

  /* v86 serial terminal */
  .v86-term {
    white-space: pre-wrap; word-break: break-word;
    font: 14px/1.45 'IBM Plex Mono', monospace;
    color: #8ef0a8; background: #000; caret-color: #8ef0a8;
  }
  .v86-term:focus { box-shadow: inset 0 0 0 1px #2a6a3a; }

  @media (max-width: 860px) {
    .site-sidebar { position: static !important; width: 100% !important; height: auto !important; border-right: 0 !important; border-bottom: 1px solid #e6dac4 !important; }
    .site-main { margin-left: 0 !important; }
    .site-two-col, .site-run-grid, .site-boot-layout { display: block !important; }
    .site-boot-side { position: static !important; width: auto !important; margin-top: 18px; }
    .site-main header, .site-main > div > div { padding-left: 22px !important; padding-right: 22px !important; }
    .site-main h1 { font-size: 52px !important; line-height: 56px !important; }
    .dosapi-call-row { grid-template-columns: 44px 1fr !important; }
    .dosapi-call-row > div:last-child { grid-column: 1 / -1; }
    .dosapi-sub-row { grid-template-columns: 1fr !important; }
    .dosapi-stat-grid { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
<noscript>LainDOS interactive documentation requires JavaScript to render the walkthrough and embedded emulator.</noscript>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script src="https://cdn.jsdelivr.net/npm/v86/build/libv86.js"></script>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="v86machine.jsx"></script>
<script type="text/babel" src="page_boot.jsx"></script>
<script type="text/babel" src="page_misc.jsx"></script>
<script type="text/babel" src="page_dosapi.jsx"></script>
<script type="text/babel" src="page_tests.jsx"></script>
<script type="text/babel" src="page_filesystem.jsx"></script>
<script type="text/babel" src="page_memory.jsx"></script>
<script type="text/babel" src="page_programs.jsx"></script>
<script type="text/babel" src="page_shell.jsx"></script>
<script type="text/babel" src="page_mouse.jsx"></script>

<script type="text/babel">
  function App() {
    const [route, setRoute] = React.useState("overview");
    const [sub, setSub] = React.useState("s0");
    const [scrollReq, setScrollReq] = React.useState(null);
    const reqN = React.useRef(0);

    const go = (target) => {
      if (target.indexOf("/") >= 0) {
        const [page, ...rest] = target.split("/");
        const s = rest.join("/");
        setRoute(page); setSub(s);
        reqN.current += 1; setScrollReq({ id: s, n: reqN.current });
      } else {
        setRoute(target);
      }
    };

    const navRoute = route === "boot" ? `boot/${sub}` : route;

    let page;
    if (route === "overview") page = <window.OverviewPage go={go} />;
    else if (route === "boot") page = <window.BootPage scrollReq={scrollReq} onActive={setSub} go={go} />;
    else if (route === "dosapi") page = <window.DosApiPage go={go} />;
    else if (route === "tests") page = <window.TestsPage go={go} />;
    else if (route === "fs") page = <window.FilesystemPage go={go} />;
    else if (route === "mem") page = <window.MemoryPage go={go} />;
    else if (route === "prog") page = <window.ProgramsPage go={go} />;
    else if (route === "shell") page = <window.ShellDocsPage go={go} />;
    else if (route === "mouse") page = <window.MouseDocsPage go={go} />;
    else if (route === "run") page = <window.RunPage go={go} />;
    else {
      const item = window.NAV.find(n => n.id === route);
      page = <window.StubPage item={item} go={go} />;
    }

    return (
      <div style={{ minHeight: "100vh", background: "#f7f1e6" }}>
        <window.Sidebar route={navRoute} go={go} />
        <main className="site-main" style={{ marginLeft: 282, minWidth: 0 }}>{page}</main>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
