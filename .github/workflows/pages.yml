name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Set up Deno
        uses: denoland/setup-deno@v2.0.4
        with:
          deno-version: v2.8.0

      - name: Build shell_monkey.img
        run: make monkey-demo

      - name: Build static site
        run: make site SITE_IMAGE=build/shell_monkey.img

      - name: Stage site
        run: |
          test -f build/site/index.html
          test -f build/site/boot.html
          test -f build/site/app.js
          test -f build/site/shell_monkey.img
          rm -rf _site
          cp -R build/site _site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
