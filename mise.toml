[env]
LAINDOS_QEMU = "../qemu-ascendancy/build-asc/qemu-system-i386-unsigned"
LAINDOS_QEMU_VGA = "std,retrace=precise"

[tasks.test]
description = "Run automated QEMU boot tests"
run = "python3 scripts/test_boot.py"

[tasks.build]
description = "Build the disk image"
run = "make"

[tasks.run]
description = "Boot LainDOS in QEMU with serial output"
run = "make run"

[tasks.run-monkey-full]
description = "Boot full VGA Monkey Island in QEMU"
run = 'python3 scripts/build_monkey_full.py && "$LAINDOS_QEMU" -drive file=build/monkey_full.img,format=raw -boot order=c -serial stdio -monitor none -vga "$LAINDOS_QEMU_VGA" -device sb16'

[tasks.build-monkey-demo]
description = "Build shell-boot Monkey Island demo floppy"
run = "make monkey-demo"

[tasks.run-monkey-demo]
description = "Boot shell-boot Monkey Island demo floppy in QEMU"
run = "make run-monkey-demo"

[tasks.run-freedos-vhd]
description = "Boot from A: with FreeDOS VHD attached as C:"
run = '''
python3 scripts/build_shell_monkey.py
hd="${LAINDOS_FREEDOS_VHD:-vendor/FreeDOS.VHD}"
"$LAINDOS_QEMU" -drive file=build/shell_monkey.img,format=raw,if=floppy -drive "file=$hd,format=vpc,if=ide,index=0,media=disk" -snapshot -boot order=a -serial stdio -monitor none -vga "$LAINDOS_QEMU_VGA" -device sb16
'''

[tasks.test-monkey-demo]
description = "Run headless shell Monkey Island demo QEMU smoke"
run = "make test-monkey-demo"

[tasks.run-monkey-full-bochs]
description = "Boot full VGA Monkey Island in Bochs"
run = "python3 scripts/run_monkey_full_bochs.py"

[tasks.build-games-hd-all]
description = "Build all-games hard disk image"
run = "python3 scripts/build_games_hd_all.py"

[tasks.build-wolf3d]
description = "Build Wolfenstein 3D shareware image"
run = "python3 scripts/build_wolf3d.py"

[tasks.run-wolf3d]
description = "Boot Wolfenstein 3D shareware in QEMU"
run = 'python3 scripts/build_wolf3d.py && "$LAINDOS_QEMU" -drive file=build/wolf3d.img,format=raw -boot order=c -serial stdio -monitor none -vga "$LAINDOS_QEMU_VGA" -device sb16'

[tasks.test-wolf3d-smoke]
description = "Run headless Wolfenstein 3D QEMU smoke"
run = "python3 scripts/test_wolf3d_smoke.py"

[tasks.test-ascendancy-smoke]
description = "Run headless Ascendancy QEMU smoke"
run = "python3 scripts/test_ascendancy_smoke.py"

[tasks.run-games-hd-all]
description = "Boot all-games hard disk image in QEMU"
run = 'python3 scripts/build_games_hd_all.py && "$LAINDOS_QEMU" -drive file=build/games_hd_all.img,format=raw -boot order=c -serial stdio -monitor none -vga "$LAINDOS_QEMU_VGA" -device sb16'

[tasks.clean]
description = "Remove build artifacts"
run = "make clean"
